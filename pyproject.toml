[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xdsmask"
version = "0.1.2"
description = "Detect per-frame low-signal detector regions (e.g. a moving goniometer shadow) in XDS INTEGRATE.HKL and mask them via FILTER.HKL"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "plotly>=5.18",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
xdsmask = "xdsmask.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
